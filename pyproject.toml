[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "red-harness-core"
version = "0.1.1"
description = "Red Harness: a defensive, evidence-bound reverse-engineering analysis harness"
readme = "README.md"
authors = [{name = "LiebertDev"}]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
keywords = ["reverse-engineering", "mcp", "ghidra", "ida", "static-analysis", "security", "evidence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
# Official MCP Python SDK, pinned version (PyPI upload date 2026-09-07; a release at least 2 weeks old was chosen).
dependencies = ["mcp==1.30.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.20"]
# `emulate` tool (docs/design/emulation.md): the Unicorn CPU emulator from PyPI, pinned. Optional: without it the tool
# answers EMULATOR_MISSING. Not bundled or redistributed by the harness (licence note in the design doc).
emulate = ["unicorn==2.1.4"]
# idapro (the idalib bridge) is DELIBERATELY NOT a dependency/extra: its publisher on PyPI is unverified
# (supply-chain risk). Install it from the local wheel in the IDA installation, see docs/usage-mcp.md:
#   pip install "<IDA>\idalib\python\idapro-<version>-py3-none-any.whl"   (exact file name; pip rejects a wildcard)
# py-activate-idalib.py is NOT run. Without idapro the IDA backend returns TOOL_MISSING ("unavailable").

[project.urls]
Homepage = "https://github.com/LiebertDev/red-harness"
Source = "https://github.com/LiebertDev/red-harness"
Issues = "https://github.com/LiebertDev/red-harness/issues"
Changelog = "https://github.com/LiebertDev/red-harness/blob/main/CHANGELOG.md"
Security = "https://github.com/LiebertDev/red-harness/blob/main/SECURITY.md"

[project.scripts]
rh = "redharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# runtime files that are not Python modules: the Ghidra query script the engine runs, the Windows Sandbox guest script
"redharness.engines.ghidra" = ["scripts/*.java"]
"redharness.sandbox" = ["guest.ps1"]
# the agent skill that `rh setup` installs
"redharness.skill" = ["SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["heavy: needs a real engine (Ghidra/IDA) or Windows Sandbox", "real_sandbox: starts a real Windows Sandbox; skipped unless RH_ALLOW_REAL_SANDBOX=1","hyperv: Phase 2 Hyper-V VM control against the real VM (read-only/no-op); skipped unless RH_ALLOW_HYPERV=1"]
